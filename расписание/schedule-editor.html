<aside class="sidebar"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="m13 2-1 4-3 1-4-2-4 6 3 3v4l-3 3 4 6 4-2 3 1 1 4h6l1-4 3-1 4 2 4-6-3-3v-4l3-3-4-6-4 2-3-1-1-4z"/><circle cx="16" cy="16" r="6" fill="#326b88"/></svg><span>Клуб<br> Кулибиных</span></div><div class="sidebar-caption">УПРАВЛЕНИЕ КЛУБОМ</div><nav class="navigation" aria-label="Разделы панели"><button data-route="groups" id="nav-groups"></button><button data-route="schedule" id="nav-schedule"></button></nav><div class="sidebar-foot"><strong>Панель администратора</strong>Демонстрационный макет</div></aside>
<div class="workspace"><header class="topbar"><div class="breadcrumb" id="breadcrumb">НАСТРОЙКИ / РАСПИСАНИЕ</div><div class="today" id="today"></div></header><main class="content" id="app"></main></div>
<dialog id="attendance-dialog" aria-labelledby="attendance-title"></dialog><dialog id="calendar-day-dialog" aria-labelledby="calendar-day-title"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='Asia/Vladivostok',STORE='culibin-schedule-prototype-v1';
const DAYS=[{id:1,short:'Пн',name:'Понедельник',plural:'понедельникам'},{id:2,short:'Вт',name:'Вторник',plural:'вторникам'},{id:3,short:'Ср',name:'Среда',plural:'средам'},{id:4,short:'Чт',name:'Четверг',plural:'четвергам'},{id:5,short:'Пт',name:'Пятница',plural:'пятницам'},{id:6,short:'Сб',name:'Суббота',plural:'субботам'},{id:0,short:'Вс',name:'Воскресенье',plural:'воскресеньям'}];
const CHILDREN=[{id:'c1',name:'Петров Александр Сергеевич',emoji:'🦾',balance:420},{id:'c2',name:'Иванов Артём Михайлович',emoji:'🚀',balance:180},{id:'c3',name:'Сидоров Никита Андреевич',emoji:'🔧',balance:330},{id:'c4',name:'Иванов Максим Дмитриевич',emoji:'🧩',balance:250},{id:'c5',name:'Петров Даниил Романович',emoji:'🦉',balance:200},{id:'c6',name:'Сидоров Михаил Олегович',emoji:'🐢',balance:80},{id:'c7',name:'Петров Илья Александрович',emoji:'🛰️',balance:500},{id:'c8',name:'Сидоров Андрей Павлович',emoji:'⚡',balance:200}];
function icon(name,size=20){const paths={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18m-13 4h2m4 0h2"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M15 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/>',check:'<path d="m5 12 4 4L19 6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>'}
function todayISO(now=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now),v=t=>p.find(x=>x.type===t).value;return v('year')+'-'+v('month')+'-'+v('day')}
function monthShift(month,delta){const [y,m]=month.split('-').map(Number);return new Date(Date.UTC(y,m-1+delta,1)).toISOString().slice(0,7)}
function monthTitle(month){return new Date(month+'-15T12:00:00Z').toLocaleDateString('ru',{month:'long',year:'numeric',timeZone:'UTC'}).replace(' г.','')}
function dateTitle(date,year=false){return new Date(date+'T12:00:00Z').toLocaleDateString('ru',{day:'numeric',month:'long',...(year?{year:'numeric'}:{}),timeZone:'UTC'})}
function normalizeWeekdays(values){return [...new Set((Array.isArray(values)?values:[values]).filter(v=>v!==null&&v!==undefined&&v!=='').map(Number).filter(v=>Number.isInteger(v)&&v>=0&&v<=6))].sort((a,b)=>(a+6)%7-(b+6)%7)}
function weekdaysText(weekdays,plural=false){const selected=normalizeWeekdays(weekdays);return DAYS.filter(d=>selected.includes(d.id)).map(d=>plural?d.plural:d.name).join(', ')}
function weekdayOn(date){const day=new Date(date+'T12:00:00Z').getUTCDay();return DAYS.find(d=>d.id===day).name}
function datesInMonth(month,weekdays){const selected=new Set(normalizeWeekdays(weekdays)),[y,m]=month.split('-').map(Number),last=new Date(Date.UTC(y,m,0)).getUTCDate(),out=[];for(let d=1;d<=last;d++){const date=new Date(Date.UTC(y,m-1,d));if(selected.has(date.getUTCDay()))out.push(date.toISOString().slice(0,10))}return out}
const DAY_STATUS_LABELS={excluded:'Не учитывать в подсчете',lesson:'Учитывать в подсчете',homework:'Учитывать в подсчете как ДЗ'};
function dayKey(groupId,date){return groupId+'|'+date}
function dayStatus(group,date,rule=ruleFor(group,date.slice(0,7))){const custom=state.dayOverrides[dayKey(group.id,date)];if(Object.hasOwn(DAY_STATUS_LABELS,custom))return custom;const weekday=new Date(date+'T12:00:00Z').getUTCDay();return rule.weekdays.includes(weekday)?'lesson':'excluded'}
function countedDates(group,month,rule=ruleFor(group,month)){return datesInMonth(month,[1,2,3,4,5,6,0]).filter(date=>dayStatus(group,date,rule)!=='excluded')}
function validISODate(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;try{return new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value}catch{return false}}
function shortDate(date){return date.slice(8,10)+'.'+date.slice(5,7)}
function accrualsFor(group,date,childId){return Object.values(state.botAccruals).filter(e=>e.groupId===group.id&&e.childId===childId&&e.lessonDate===date&&e.creditedOn<=today)}
function completionInfo(group,date,childId){
 const key=markKey(group.id,date,childId),homework=dayStatus(group,date)==='homework';
 if(homework){const done=state.homework[key]==='present';return{status:done?'present':'',kind:'homework',label:done?'ДЗ выполнено':'ДЗ не отмечено',note:done?'ДЗ':'',completedOn:done?(state.homeworkCompletedOn[key]||date):null}}
 const receipts=accrualsFor(group,date,childId);
 if(receipts.length)return{status:'present',kind:'bot',label:'КК начислены в чат-боте',note:'',completedOn:receipts.map(e=>e.creditedOn).sort()[0]};
 const makeup=state.makeups[key];
 if(makeup?.type==='other-day'&&validISODate(makeup.date)&&makeup.date<=today&&makeup.date!==date)return{status:'present',kind:'makeup-day',label:'Отработал: посетил занятие '+dateTitle(makeup.date,true),note:shortDate(makeup.date),completedOn:makeup.date};
 if(makeup?.type==='homework'&&validISODate(makeup.completedOn)&&makeup.completedOn<=today)return{status:'present',kind:'makeup-homework',label:'Отработал как ДЗ',note:'ДЗ',completedOn:makeup.completedOn};
 return{status:'',kind:'uncredited',label:'КК не начислены на занятии',note:'',completedOn:null};
}
function completionStatus(group,date,childId){return completionInfo(group,date,childId).status}
function closeDialogs(){document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close())}
function shortName(child){const [family,given]=child.name.split(' ');return family+' '+given[0]+' '+child.emoji}
function initials(child){return child.name.split(' ').slice(0,2).map(s=>s[0]).join('')}
function plural(n,one,few,many){return n%100>=11&&n%100<=14?many:n%10===1?one:n%10>=2&&n%10<=4?few:many}
function markKey(groupId,date,childId){return groupId+'|'+date+'|'+childId}
function awardKey(groupId,month,childId){return groupId+'|'+month+'|'+childId}
function ruleFor(group,month){return [...group.rules].sort((a,b)=>a.from.localeCompare(b.from)).filter(r=>r.from<=month).at(-1)}
function createDemo(today){const month=today.slice(0,7),previous=monthShift(month,-1);const groups=[{id:'g1',name:'Шк34-1',members:['c1','c2','c5','c6'],rules:[{from:'0000-01',weekdays:[4],bonus:20}]},{id:'g2',name:'Шк34-3',members:['c1','c4','c8'],rules:[{from:'0000-01',weekdays:[1],bonus:20}]},{id:'g3',name:'Шк12-2',members:['c3','c5','c7'],rules:[{from:'0000-01',weekdays:[6],bonus:20}]}];const data={version:5,groups,attendance:{},homework:{},dayOverrides:{},awards:{},botAccruals:{},makeups:{},homeworkCompletedOn:{}};for(const group of groups){for(const m of [previous,month]){const dates=datesInMonth(m,ruleFor(group,m).weekdays).filter(d=>d<=today);group.members.forEach((id,index)=>dates.forEach((date,i)=>{let status='present';if(index===1&&i===1)status=null;if(index===group.members.length-1&&i===dates.length-1)status=null;if(status)data.attendance[markKey(group.id,date,id)]=status}))}}return migrateState(data)}
function migrateState(data){
 if(!data||![1,2,3,4,5].includes(data.version)||!Array.isArray(data.groups)||!data.groups.length||!data.attendance||!data.awards)throw Error('Invalid data');
 for(const group of data.groups){
  const oldRules=[...group.rules].sort((a,b)=>a.from.localeCompare(b.from));
  if(data.version===2){
   // Preserve each historical schedule and common amount as group-specific rules.
   if(!Array.isArray(data.bonusRules)||!data.bonusRules.length)throw Error('Missing bonus rules');
   const oldBonuses=[...data.bonusRules].sort((a,b)=>a.from.localeCompare(b.from));
   const periods=[...new Set([...oldRules.map(r=>r.from),...oldBonuses.map(r=>r.from)])].sort();
   group.rules=periods.map(from=>{const r=oldRules.filter(r=>r.from<=from).at(-1)||oldRules[0],bonus=oldBonuses.filter(r=>r.from<=from).at(-1)||oldBonuses[0];return{from,weekdays:normalizeWeekdays(r.weekdays??r.weekday),bonus:bonus.amount}});
  }else{
   group.rules=oldRules.map(r=>({from:r.from,weekdays:normalizeWeekdays(r.weekdays??r.weekday),bonus:Number(r.bonus??20)}));
  }
  if(group.rules.some(r=>!r.weekdays.length))throw Error('Missing weekdays');
 }
 delete data.bonusRules;data.homework=data.homework||{};data.dayOverrides=data.dayOverrides||{};
 data.botAccruals=data.botAccruals||{};data.makeups=data.makeups||{};data.homeworkCompletedOn=data.homeworkCompletedOn||{};
 // Legacy green marks become demo bot receipts; obsolete absence marks are removed.
 for(const [key,status] of Object.entries(data.attendance)){
  if(status!=='present'){delete data.attendance[key];continue}
  const [groupId,lessonDate,childId]=key.split('|');
  if(!Object.values(data.botAccruals).some(e=>e.groupId===groupId&&e.lessonDate===lessonDate&&e.childId===childId)){
   data.botAccruals['legacy|'+key]={id:'legacy|'+key,groupId,lessonDate,childId,amount:0,creditedOn:lessonDate,includeInBalance:false,source:'demo'};
  }
 }
 for(const [key,status] of Object.entries(data.homework))if(status!=='present'){delete data.homework[key];delete data.homeworkCompletedOn[key]}
 data.version=5;
 return data;
}
let today=todayISO(),state;try{state=migrateState(JSON.parse(localStorage.getItem(STORE)))}catch{state=createDemo(today)}
let route='schedule',selectedGroup=state.groups[0].id,selectedChild=state.groups[0].members[0],viewMonth=today.slice(0,7),draft=null,bonusDraft=null,motivationDraft=null,editing=null,toastTimer,storageAvailable=true;
function groupNow(){return state.groups.find(g=>g.id===selectedGroup)}
function currentRule(){return ruleFor(groupNow(),today.slice(0,7))}
function resetDraft(){draft={...currentRule(),weekdays:[...currentRule().weekdays]}}
function bonusFor(month,group=groupNow()){return ruleFor(group,month).bonus}
function resetBonusDraft(){bonusDraft=bonusFor(today.slice(0,7));motivationDraft=motivationFor(groupNow())}
function bonusDirty(){const saved=motivationFor(groupNow());return String(bonusDraft)!==String(bonusFor(today.slice(0,7)))||motivationDraft.title!==saved.title||motivationDraft.content!==saved.content}
function dirty(){const saved=currentRule();return JSON.stringify(normalizeWeekdays(draft.weekdays))!==JSON.stringify(saved.weekdays)}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));storageAvailable=true;return true}catch{storageAvailable=false;toast('Браузер не сохранил изменения. Они доступны до закрытия файла.');return false}}
function attendanceFor(group,month,childId){
 const rule=ruleFor(group,month),dates=countedDates(group,month),homeworkCount=dates.filter(d=>dayStatus(group,d)==='homework').length;
 const present=dates.filter(d=>d<=today&&completionStatus(group,d,childId)==='present').length;
 let streak=0;for(const d of dates.filter(d=>d<=today)){if(completionStatus(group,d,childId)==='present')streak++;else streak=0}
 return{rule,bonus:bonusFor(month,group),dates,present,streak,homeworkCount,lessonCount:dates.length-homeworkCount,hasHomework:homeworkCount>0,complete:dates.length>0&&present===dates.length,award:state.awards[awardKey(group.id,month,childId)]||null};
}
function reconcileAwards(){const old=JSON.stringify(state.awards),months=new Set([...Object.keys(state.attendance),...Object.keys(state.homework),...Object.keys(state.dayOverrides),...Object.keys(state.makeups)].map(k=>k.split('|')[1].slice(0,7)));for(const award of Object.values(state.awards))months.add(award.month);for(const group of state.groups){for(const month of months){if(month>today.slice(0,7))continue;for(const id of group.members){const a=attendanceFor(group,month,id),key=awardKey(group.id,month,id);if(a.complete&&a.dates.at(-1)<=today){if(!state.awards[key])state.awards[key]={id:key,groupId:group.id,childId:id,month,amount:a.bonus,date:[a.dates.at(-1),...a.dates.map(d=>completionInfo(group,d,id).completedOn||d)].sort().at(-1)};}else delete state.awards[key]}}}return old!==JSON.stringify(state.awards)}
function balanceFor(child){return child.balance+Object.values(state.awards).filter(a=>a.childId===child.id).reduce((sum,a)=>sum+a.amount,0)+Object.values(state.botAccruals).filter(e=>e.childId===child.id&&e.includeInBalance).reduce((sum,e)=>sum+e.amount,0)}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function monthNav(){return '<div class="month-nav"><button class="icon-btn" data-month="-1" aria-label="Предыдущий месяц">'+icon('left',17)+'</button><span class="month-name">'+esc(monthTitle(viewMonth))+'</span><button class="icon-btn" data-month="1" aria-label="Следующий месяц">'+icon('right',17)+'</button></div>'}
function groupPicker(){return '<div class="group-picker"><div><label for="group-select">Группа</label><p class="hint">Выберите существующую группу</p></div><div class="select-wrap"><select id="group-select">'+state.groups.map(g=>'<option value="'+g.id+'" '+(g.id===selectedGroup?'selected':'')+'>'+esc(g.name)+' · '+g.members.length+' '+plural(g.members.length,'ребёнок','ребёнка','детей')+'</option>').join('')+'</select></div></div>'}
function calendar(){
 const group=groupNow(),rule=viewMonth>=today.slice(0,7)?draft:ruleFor(group,viewMonth),dates=countedDates(group,viewMonth,rule),homeworkCount=dates.filter(d=>dayStatus(group,d,rule)==='homework').length;
 const [y,m]=viewMonth.split('-').map(Number),offset=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,last=new Date(Date.UTC(y,m,0)).getUTCDate();
 return '<section class="card calendar-card"><div class="card-header"><h2>'+icon('calendar')+'Календарь занятий</h2></div><div class="calendar-body">'+monthNav()+'<div class="calendar-grid">'+DAYS.map(d=>'<span class="calendar-weekday">'+d.short+'</span>').join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:last},(_,i)=>{
  const date=viewMonth+'-'+String(i+1).padStart(2,'0'),type=dayStatus(group,date,rule),custom=state.dayOverrides[dayKey(group.id,date)],classes=(type==='lesson'?'scheduled':type==='homework'?'homework':custom==='excluded'?'excluded':'');
  return '<button type="button" class="calendar-day '+classes+' '+(date===today?'today':'')+'" data-calendar-date="'+date+'" aria-haspopup="dialog" aria-label="'+esc(dateTitle(date,true))+': '+esc(DAY_STATUS_LABELS[type])+'" title="'+esc(DAY_STATUS_LABELS[type])+'"><span>'+String(i+1)+'</span>'+(type==='homework'?'<span class="calendar-kind">ДЗ</span>':'')+'</button>';
 }).join('')+'</div><div class="calendar-summary"><strong>'+dates.length+'</strong><span>'+plural(dates.length,'дата','даты','дат')+' в подсчете<br>'+(dates.length-homeworkCount)+' '+plural(dates.length-homeworkCount,'занятие','занятия','занятий')+(homeworkCount?' · '+homeworkCount+' ДЗ':'')+'</span></div><div class="calendar-legend"><span><i class="day-swatch lesson"></i>Занятие</span><span><i class="day-swatch homework"></i>ДЗ</span><span><i class="day-swatch excluded"></i>Не учитывать</span></div></div><div class="calendar-foot">'+(dirty()&&viewMonth>=today.slice(0,7)?'Предпросмотр расписания. Сохраните выбранные дни недели. ':'')+'Нажмите на дату, чтобы изменить её статус для этой группы.</div></section>';
}
function childPreview(){const group=groupNow(),child=CHILDREN.find(c=>c.id===selectedChild)||CHILDREN.find(c=>c.id===group.members[0]),a=attendanceFor(group,viewMonth,child.id),remaining=a.dates.length-a.present,closed=viewMonth<today.slice(0,7);let message='',note='';if(!a.dates.length){message='Нет дат для подсчета';note='В этом месяце бонус не начисляется.'}else if(a.award){message='Бонус +'+a.award.amount+' КК начислен';note=(a.hasHomework?'За все посещения и выполненные ДЗ. Начисление: ':'За посещение всех занятий. Начисление: ')+dateTitle(a.award.date)+'.'}else if(a.complete){message='Все учитываемые даты подтверждены';note=closed?'Бонус будет пересчитан автоматически.':'+'+a.bonus+' КК начисляются после подтверждения последней учитываемой даты.'}else{message='Ещё '+remaining+' '+(a.hasHomework?plural(remaining,'дата','даты','дат'):plural(remaining,'занятие','занятия','занятий'))+' до бонуса +'+a.bonus+' КК';note=a.streak?(a.hasHomework?'Подряд выполнено: '+a.streak:a.streak+' '+plural(a.streak,'занятие','занятия','занятий')+' подряд')+'. Бонус — в последний учитываемый день месяца.':a.present?(a.hasHomework?'Для бонуса нужны все посещения и выполненные ДЗ месяца.':'Для бонуса нужно посетить все занятия месяца.'):'Отметки посещений появятся здесь после занятий.'}return '<section class="card preview-card section-gap"><div class="card-header"><h2 class="preview-top">'+icon('eye')+'Карточка ребёнка</h2><div class="select-wrap"><select id="child-select" aria-label="Ребёнок для предпросмотра">'+group.members.map(id=>{const c=CHILDREN.find(c=>c.id===id);return '<option value="'+id+'" '+(id===child.id?'selected':'')+'>'+esc(shortName(c))+'</option>'}).join('')+'</select></div></div><div class="preview-content"><div><div class="child-mini"><span class="avatar">'+initials(child)+'</span><div><h3>'+esc(shortName(child))+'</h3><p class="subtle">Так ребёнок видит свой прогресс</p></div></div><p class="mini-balance"><strong>'+balanceFor(child)+'</strong> КК на счёте</p></div><div><div class="progress-top"><span>'+esc(monthTitle(viewMonth))+'</span><strong>'+a.present+' из '+a.dates.length+' '+(a.hasHomework?'дат':'занятий')+'</strong></div><div class="visits-track" role="img" aria-label="Посещено '+a.present+' из '+a.dates.length+' '+(a.hasHomework?'дат':'занятий')+'">'+a.dates.map(date=>{const info=completionInfo(group,date,child.id),yes=date<=today&&info.status==='present',homework=dayStatus(group,date)==='homework';return '<span class="visit-step '+(yes?'done':'')+' '+(yes&&info.note?'with-note':'')+'" title="'+esc(dateTitle(date)+' · '+info.label)+'" aria-hidden="true">'+(yes?'✓'+(info.note?'<small>'+esc(info.note)+'</small>':''):homework?'ДЗ':Number(date.slice(8)))+'</span>'}).join('')+'</div><div class="preview-motivation" id="motivation-preview" data-auto-message="'+esc(message)+'" data-auto-note="'+esc(note)+'">'+motivationPreview(message,note)+'</div></div></div></section>'}
function formatMotivationContent(text){return text.trim().split(/\n\s*\n/).map(paragraph=>'<p>'+esc(paragraph).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</p>').join('')}
function motivationFor(group){return{title:typeof group.motivation?.title==='string'&&group.motivation.title.trim()?group.motivation.title.trim():'Твой путь к бонусу',content:typeof group.motivation?.content==='string'?group.motivation.content:''}}
function motivationPreview(message,note){const copy=motivationDraft||motivationFor(groupNow());return '<h3>'+esc(copy.title||'Твой путь к бонусу')+'</h3>'+(copy.content.trim()?'<div class="motivation-copy">'+formatMotivationContent(copy.content)+'</div>':'<p class="progress-message">'+esc(message)+'</p><p class="progress-note">'+esc(note)+'</p>')}
function updateBonusStatus(){const changed=bonusDirty();$('#save-bonus').disabled=!changed;$('#bonus-saved-label').classList.toggle('dirty',changed);$('#bonus-saved-label').innerHTML=icon(changed?'clock':'check',15)+(changed?'Не сохранено':'Настройки сохранены');const preview=$('#motivation-preview');if(preview)preview.innerHTML=motivationPreview(preview.dataset.autoMessage,preview.dataset.autoNote)}
function groupBonusCard(){return '<div class="bonus-setting"><form id="group-bonus-form"><label for="bonus-input">Бонус за подряд посещённые занятия в течение месяца</label><div class="bonus-input"><input id="bonus-input" name="bonus" type="number" min="1" max="100000" step="1" required value="'+esc(bonusDraft)+'"><span>КК</span></div><div class="motivation-fields"><h3>Текст в карточке ребёнка</h3><label for="motivation-title-input">Заголовок</label><input id="motivation-title-input" name="motivation-title" maxlength="120" required value="'+esc(motivationDraft.title)+'"><label for="motivation-content-input">Контент</label><textarea id="motivation-content-input" name="motivation-content" maxlength="2000" rows="5" placeholder="**Один шаг до бонуса!**&#10;&#10;Посети ещё одно занятие — и получишь награду. Уже начислено +20 КК.">'+esc(motivationDraft.content)+'</textarea><p class="field-help">Текст для детей выбранной группы. **Текст** — жирное выделение. Пустой контент — автоматическая подсказка по прогрессу.</p></div><div class="bonus-setting-controls"><button class="btn primary" id="save-bonus" '+(!bonusDirty()?'disabled':'')+'>Сохранить</button><span class="saved-label '+(bonusDirty()?'dirty':'')+'" id="bonus-saved-label">'+icon(bonusDirty()?'clock':'check',15)+(bonusDirty()?'Не сохранено':'Настройки сохранены')+'</span></div><p class="dialog-error" id="bonus-error" role="alert"></p></form></div>'}
function scheduleScreen(){return '<div class="page-intro"><div class="eyebrow">НАСТРОЙКИ КЛУБА</div><h1>Редактор расписания</h1><p>Дни занятий, бонус и текст в карточке ребёнка для каждой группы.</p></div>'+groupPicker()+'<div class="layout"><section class="card"><div class="card-header"><h2>'+icon('settings')+'Настройки занятий</h2><span class="pill">'+esc(groupNow().name)+'</span></div><form id="schedule-form"><div class="card-body"><div class="field"><label>Дни проведения занятий</label><div class="weekdays" role="group" aria-label="Дни проведения занятий">'+DAYS.map(d=>'<button type="button" class="weekday" data-weekday="'+d.id+'" aria-label="'+d.name+'" aria-pressed="'+(draft.weekdays.includes(d.id))+'">'+d.short+'</button>').join('')+'</div><p class="field-help">Выберите один или несколько дней. Изменения действуют с текущего месяца.</p></div><div class="rule">'+icon('info',18)+'<p><strong>Как начисляется бонус</strong><br>Бонус начисляется в день последнего учитываемого занятия или ДЗ, если все даты подтверждены. Исключённые даты не влияют на подсчет.</p></div><p class="dialog-error" id="schedule-error" role="alert"></p></div></form>'+groupBonusCard()+'<div class="form-footer"><span class="saved-label '+(dirty()?'dirty':'')+'" id="saved-label">'+icon(dirty()?'clock':'check',15)+(dirty()?'Есть несохранённые изменения':'Расписание сохранено')+'</span><button type="submit" form="schedule-form" class="btn primary" id="save-schedule" '+(!dirty()?'disabled':'')+'>Сохранить расписание</button></div></section>'+calendar()+'</div><div class="section-gap">'+attendancePanel()+'</div>'+childPreview()}
function groupsScreen(){return '<div class="page-intro"><div class="eyebrow">УПРАВЛЕНИЕ КЛУБОМ</div><h1>Группы</h1><p>Расписание занятий и посещаемость детей.</p></div><section class="card"><div class="card-header"><h2>'+icon('users')+'Группы клуба</h2><span class="pill">'+state.groups.length+' группы</span></div><div class="table-wrap"><table class="groups-table"><thead><tr><th>Группа</th><th>Дни занятий</th><th>Дети</th><th>Бонус</th><th></th></tr></thead><tbody>'+state.groups.map(g=>{const r=ruleFor(g,today.slice(0,7));return '<tr><td><span class="group-name">'+esc(g.name)+'</span><p class="table-sub">'+countedDates(g,today.slice(0,7)).length+' '+plural(countedDates(g,today.slice(0,7)).length,'дата','даты','дат')+' в подсчете за месяц</p></td><td>'+weekdaysText(r.weekdays)+'</td><td>'+g.members.length+'</td><td>'+bonusFor(today.slice(0,7),g)+' КК</td><td><button class="btn secondary" data-open-group="'+g.id+'">Открыть</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function rowStatus(a){if(!a.dates.length)return '<span class="pill gray">Нет дат для подсчета</span>';if(a.award)return '<span class="pill green">+'+a.award.amount+' КК начислено</span>';if(a.complete)return '<span class="pill green">Бонус готов к начислению</span>';return '<span class="pill gray">'+(viewMonth>today.slice(0,7)?'Запланировано':a.hasHomework?'Ожидает отметок':'Ожидает начисления КК')+'</span>'}
function attendancePanel(){const group=groupNow(),rule=ruleFor(group,viewMonth),dates=countedDates(group,viewMonth),hasHomework=dates.some(d=>dayStatus(group,d)==='homework');return '<section class="card"><div class="journal-head"><div class="journal-title"><h2>Посещаемость</h2><span class="pill '+(viewMonth<today.slice(0,7)?'gray':'')+'">'+(viewMonth<today.slice(0,7)?'Месяц завершён':viewMonth===today.slice(0,7)?'Текущий месяц':'План на месяц')+'</span></div><div class="journal-tools">'+monthNav()+'<button class="btn secondary" data-current-month '+(viewMonth===today.slice(0,7)?'disabled':'')+'>Текущий месяц</button></div></div><div class="journal-subline"><p>Нажмите на отметку, чтобы посмотреть начисление или указать отработку.</p><div class="legend"><span><i class="legend-mark yes">✓</i>КК начислены / отработано</span><span><i class="legend-mark none">—</i>КК не начислены на занятии</span></div></div><div class="table-wrap"><table class="attendance-table"><thead><tr><th scope="col">Ребёнок</th>'+dates.map(date=>'<th scope="col">'+dateTitle(date)+'<span class="date-weekday">'+weekdayOn(date)+'</span>'+(dayStatus(group,date)==='homework'?'<span class="day-kind-badge">ДЗ</span>':'')+'</th>').join('')+'<th scope="col">Прогресс и бонус</th></tr></thead><tbody>'+group.members.map(id=>{const child=CHILDREN.find(c=>c.id===id),a=attendanceFor(group,viewMonth,id);return '<tr><td><div class="student-cell"><span class="avatar">'+initials(child)+'</span><strong>'+esc(shortName(child))+'</strong></div></td>'+dates.map(date=>{const future=date>today,info=completionInfo(group,date,id),done=!future&&info.status==='present';return '<td><button class="mark '+(done?'present':future?'future':'')+' '+(done&&info.note?'with-note':'')+'" data-mark-date="'+date+'" data-mark-child="'+id+'" '+(future?'disabled':'')+' aria-label="'+esc(shortName(child))+', '+esc(dateTitle(date))+': '+esc(future?'занятие ещё не наступило':info.label)+'" title="'+esc(future?'Отметка будет доступна в день занятия':info.label)+'">'+(future?'·':done?'✓':'—')+(done&&info.note?'<small>'+esc(info.note)+'</small>':'')+'</button></td>';}).join('')+'<td><div class="progress-small">'+a.present+' из '+dates.length+' '+(hasHomework?'дат':'занятий')+'</div>'+rowStatus(a)+'</td></tr>'}).join('')+'</tbody></table></div><div class="table-footer">'+(dates.length?'Бонус '+bonusFor(viewMonth)+' КК начисляется в день последнего учитываемого занятия или ДЗ за все '+(hasHomework?'учитываемые посещения и выполненные ДЗ.':dates.length+' '+plural(dates.length,'занятие','занятия','занятий')+'.'):'В этом месяце нет учитываемых дат. Бонус не начисляется.')+' Отметки на будущие даты недоступны.'+(hasHomework?' ДЗ засчитывается только после отметки выполнения у ребёнка.':'')+' Отработка в следующем месяце засчитывается за исходное занятие. Данные начислений в этом макете демонстрационные: рабочий чат-бот не подключён.</div></section>'}
function journalScreen(){const group=groupNow(),rule=ruleFor(group,viewMonth);return '<button class="btn text back-btn" data-route="groups">Все группы</button><div class="page-intro"><div class="eyebrow">КАРТОЧКА ГРУППЫ</div><h1>'+esc(group.name)+'</h1><p>'+weekdaysText(rule.weekdays)+' · '+group.members.length+' '+plural(group.members.length,'ребёнок','ребёнка','детей')+' · бонус за месяц '+bonusFor(viewMonth)+' КК</p></div>'+groupPicker()+attendancePanel()+childPreview()}
function render(){const group=groupNow();if(!group.members.includes(selectedChild))selectedChild=group.members[0];$('#nav-groups').innerHTML=icon('users')+'<span>Группы</span>';$('#nav-schedule').innerHTML=icon('calendar')+'<span>Редактор расписания</span>';$('#nav-groups').classList.toggle('active',route!=='schedule');$('#nav-schedule').classList.toggle('active',route==='schedule');$('#nav-groups').setAttribute('aria-current',route!=='schedule'?'page':'false');$('#nav-schedule').setAttribute('aria-current',route==='schedule'?'page':'false');$('#breadcrumb').textContent=route==='schedule'?'НАСТРОЙКИ / РАСПИСАНИЕ':route==='journal'?'ГРУППЫ / ПОСЕЩАЕМОСТЬ':'УПРАВЛЕНИЕ / ГРУППЫ';$('#today').innerHTML=icon('calendar',16)+'<span>Сегодня, '+dateTitle(today)+'</span>';$('#app').innerHTML=(route==='schedule'?scheduleScreen():route==='journal'?journalScreen():groupsScreen())+'<footer class="screen-footer"><span>Клуб Кулибиных · панель администратора</span><span>'+icon('info',13)+'Демонстрационные данные · сохранение в этом браузере</span></footer>';bindFields()}
function bindFields(){
 if($('#group-select'))$('#group-select').onchange=e=>{selectedGroup=e.target.value;selectedChild=groupNow().members[0];resetDraft();resetBonusDraft();render()};
 if($('#child-select'))$('#child-select').onchange=e=>{selectedChild=e.target.value;render()};
 if($('#bonus-input'))$('#bonus-input').oninput=e=>{bonusDraft=e.target.value;updateBonusStatus()};
 if($('#motivation-title-input'))$('#motivation-title-input').oninput=e=>{motivationDraft.title=e.target.value;updateBonusStatus()};
 if($('#motivation-content-input'))$('#motivation-content-input').oninput=e=>{motivationDraft.content=e.target.value;updateBonusStatus()};
 if($('#group-bonus-form'))$('#group-bonus-form').onsubmit=e=>{
  e.preventDefault();const amount=Number(bonusDraft);
  if(!Number.isInteger(amount)||amount<1||amount>100000){$('#bonus-error').textContent='Введите целое число от 1 до 100 000 КК.';return}
  const title=motivationDraft.title.trim();if(!title){$('#bonus-error').textContent='Введите заголовок.';return}const group=groupNow();group.motivation={title,content:motivationDraft.content.trim()};const month=today.slice(0,7),rule={...currentRule(),from:month,weekdays:[...currentRule().weekdays],bonus:amount};group.rules=group.rules.filter(r=>r.from!==month);group.rules.push(rule);reconcileAwards();
  const saved=persist();resetBonusDraft();render();if(saved)toast('Бонус и текст сохранены для группы '+group.name+'.');
 };
 if($('#schedule-form'))$('#schedule-form').onsubmit=e=>{
  e.preventDefault();const weekdays=normalizeWeekdays(draft.weekdays);if(!weekdays.length){$('#schedule-error').textContent='Выберите хотя бы один день недели.';return}const group=groupNow(),month=today.slice(0,7),rule={from:month,weekdays,bonus:currentRule().bonus};
  group.rules=group.rules.filter(r=>r.from!==month);group.rules.push(rule);reconcileAwards();
  const saved=persist();resetDraft();render();if(saved)toast('Расписание группы сохранено с текущего месяца.');
 };
}
function receiveBotAccrual(event){
 if(!event||typeof event.id!=='string'||!event.id.trim())throw Error('У начисления должен быть идентификатор.');
 const group=state.groups.find(g=>g.id===event.groupId),child=CHILDREN.find(c=>c.id===event.childId);
 if(!group||!child||!group.members.includes(child.id))throw Error('Ребёнок не найден в указанной группе.');
 if(!validISODate(event.lessonDate)||event.lessonDate>today)throw Error('Дата занятия должна быть сегодняшней или прошедшей.');
 if(!Number.isInteger(event.amount)||event.amount<=0)throw Error('Сумма начисления должна быть положительным целым числом.');
 if(Object.hasOwn(state.botAccruals,event.id))return{duplicate:true};
 const record={id:event.id,groupId:group.id,childId:child.id,lessonDate:event.lessonDate,amount:event.amount,creditedOn:today,includeInBalance:true,source:event.source==='demo'?'demo':'bot'};
 Object.defineProperty(state.botAccruals,event.id,{value:record,writable:true,enumerable:true,configurable:true});
 state.attendance[markKey(group.id,event.lessonDate,child.id)]='present';
 reconcileAwards();const saved=persist();closeDialogs();render();if(saved)toast('Начислено +'+event.amount+' КК. Занятие отмечено посещённым.');return{duplicate:false};
}
// For a future bot bridge; this standalone file only simulates the incoming event.
window.ScheduleEditor=Object.freeze({receiveBotAccrual});
window.addEventListener('culibin:kk-accrued',e=>{try{receiveBotAccrual(e.detail)}catch(error){toast(error.message)}});
function openMark(date,childId){
 const group=groupNow(),homework=dayStatus(group,date)==='homework';if(date>today||dayStatus(group,date)==='excluded')return;
 editing={date,childId,groupId:selectedGroup};const child=CHILDREN.find(c=>c.id===childId),key=markKey(group.id,date,childId),info=completionInfo(group,date,childId),makeup=state.makeups[key],confirmed=info.kind==='bot';
 const header='<div class="dialog-header"><h2 id="attendance-title">'+(homework?'Выполнение ДЗ':'Статус занятия')+'</h2><button type="button" class="close" data-close aria-label="Закрыть">'+icon('close')+'</button></div><div class="dialog-body"><h3>'+esc(shortName(child))+'</h3><p class="field-help">'+esc(dateTitle(date,true))+' · '+esc(group.name)+(homework?' · ДЗ':'')+'</p>';
 let body='';
 if(homework){body=[{value:'present',label:'ДЗ выполнено'},{value:'',label:'ДЗ не отмечено'}].map(option=>'<label class="status-option"><input type="radio" name="homework-status" value="'+option.value+'" '+(option.value===(info.status==='present'?'present':'')?'checked':'')+'>'+option.label+'</label>').join('')}
 else if(confirmed){const receipts=accrualsFor(group,date,childId),amount=receipts.reduce((sum,e)=>sum+e.amount,0);body='<div class="credit-evidence">'+icon('check',21)+'<div><strong>КК начислены в чат-боте</strong><p>'+(amount?'Начислено +'+amount+' КК. ':'')+'Занятие автоматически отмечено посещённым.</p></div></div><p class="field-help">Подтверждённое начисление не требует ручной отметки.</p>'}
 else{const selected=info.status==='present'?'makeup':'uncredited',type=makeup?.type==='homework'?'homework':'other-day';body='<label class="status-option"><input type="radio" name="lesson-status" value="uncredited" '+(selected==='uncredited'?'checked':'')+'><span>КК не начислены на занятии<small>Посещение подтверждается начислением КК из чат-бота.</small></span></label><label class="status-option"><input type="radio" name="lesson-status" value="makeup" '+(selected==='makeup'?'checked':'')+'><span>Отработал пропущенное занятие</span></label><div class="makeup-fields" id="makeup-fields"><label for="makeup-type">Способ отработки</label><div class="select-wrap"><select id="makeup-type" name="makeup-type"><option value="other-day" '+(type==='other-day'?'selected':'')+'>Посетил занятие в другой день</option><option value="homework" '+(type==='homework'?'selected':'')+'>Отработал как ДЗ</option></select></div><div id="makeup-date-field"><label for="makeup-date">Дата фактического посещения</label><input id="makeup-date" name="makeup-date" type="date" max="'+today+'" value="'+esc(makeup?.date||'')+'"></div><p class="field-help">Отработка закроет исходное занятие, в том числе в следующем месяце.</p></div><p class="dialog-error" id="makeup-error" role="alert"></p><div class="demo-credit"><span>Имитация события из чат-бота</span><button type="button" class="btn secondary" id="demo-accrual">Тестовое начисление +10 КК</button></div>'}
 $('#attendance-dialog').innerHTML='<form id="attendance-form">'+header+body+'</div><div class="dialog-footer"><button type="button" class="btn secondary" data-close>'+(confirmed?'Закрыть':'Отмена')+'</button>'+(confirmed?'':'<button class="btn primary">Сохранить отметку</button>')+'</div></form>';
 $('#attendance-dialog').showModal();
 if(!homework&&!confirmed){
  const refresh=()=>{const enabled=$('input[name="lesson-status"]:checked')?.value==='makeup',dated=$('#makeup-type').value==='other-day';$('#makeup-fields').hidden=!enabled;$('#makeup-date-field').hidden=!dated;$('#makeup-date').disabled=!enabled||!dated;$('#makeup-date').required=enabled&&dated;$('#makeup-error').textContent=''};
  document.querySelectorAll('input[name="lesson-status"]').forEach(r=>r.onchange=refresh);$('#makeup-type').onchange=refresh;refresh();
  $('#demo-accrual').onclick=()=>receiveBotAccrual({id:'demo|'+key,groupId:group.id,childId,lessonDate:date,amount:10,source:'demo'});
 }
 $('#attendance-form').onsubmit=e=>{
  e.preventDefault();if(confirmed)return;const f=new FormData(e.target);
  if(homework){if(f.get('homework-status')==='present'){if(state.homework[key]!=='present')state.homeworkCompletedOn[key]=today;state.homework[key]='present'}else{delete state.homework[key];delete state.homeworkCompletedOn[key]}}
  else if(f.get('lesson-status')==='makeup'){
   const type=f.get('makeup-type');if(type==='other-day'){const actual=f.get('makeup-date');if(!validISODate(actual)||actual>today||actual===date){$('#makeup-error').textContent='Укажите прошедшую или сегодняшнюю дату, отличающуюся от даты исходного занятия.';return}state.makeups[key]={type:'other-day',date:actual,completedOn:actual}}
   else state.makeups[key]={type:'homework',completedOn:makeup?.type==='homework'?makeup.completedOn:today};
  }else delete state.makeups[key];
  const changed=reconcileAwards(),saved=persist();$('#attendance-dialog').close();render();if(saved)toast(changed?'Отметка сохранена. Бонус за месяц пересчитан.':'Отметка сохранена.');
 };
}
function openCalendarDay(date){
 const group=groupNow(),previewRule=viewMonth>=today.slice(0,7)?draft:ruleFor(group,viewMonth),current=dayStatus(group,date,previewRule);
 const options=[{value:'excluded',label:DAY_STATUS_LABELS.excluded,description:'Дата не влияет на прогресс и условие бонуса.'},{value:'lesson',label:DAY_STATUS_LABELS.lesson,description:'Занятие с отметкой посещения у каждого ребёнка.'},{value:'homework',label:DAY_STATUS_LABELS.homework,description:'ДЗ засчитывается после отметки его выполнения у ребёнка.'}];
 $('#calendar-day-dialog').innerHTML='<form id="calendar-day-form"><div class="dialog-header"><h2 id="calendar-day-title">Статус дня</h2><button type="button" class="close" data-close aria-label="Закрыть">'+icon('close')+'</button></div><div class="dialog-body"><h3>'+esc(dateTitle(date,true))+'</h3><p class="field-help">Группа '+esc(group.name)+'</p>'+options.map(option=>'<label class="status-option"><input type="radio" name="day-status" value="'+option.value+'" '+(option.value===current?'checked':'')+'><span>'+option.label+'<small>'+option.description+'</small></span></label>').join('')+(date.slice(0,7)<today.slice(0,7)?'<p class="field-help">Изменение статуса пересчитает бонусы за этот месяц.</p>':'')+'</div><div class="dialog-footer"><button type="button" class="btn secondary" data-close>Отмена</button><button class="btn primary">Сохранить статус</button></div></form>';
 $('#calendar-day-dialog').showModal();$('#calendar-day-form').onsubmit=e=>{e.preventDefault();const value=new FormData(e.target).get('day-status');if(!Object.hasOwn(DAY_STATUS_LABELS,value))return;state.dayOverrides[dayKey(group.id,date)]=value;const changed=reconcileAwards(),saved=persist();$('#calendar-day-dialog').close();render();if(saved)toast(changed?'Статус дня сохранён. Бонусы за месяц пересчитаны.':'Статус дня сохранён для группы '+group.name+'.')};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){b.closest('dialog')?.close();return}if(b.dataset.calendarDate){openCalendarDay(b.dataset.calendarDate);return}if(b.dataset.route){route=b.dataset.route;resetDraft();resetBonusDraft();render();return}if(b.dataset.openGroup){selectedGroup=b.dataset.openGroup;selectedChild=groupNow().members[0];route='journal';resetDraft();resetBonusDraft();render();return}if(b.hasAttribute('data-weekday')){const day=Number(b.dataset.weekday);draft.weekdays=normalizeWeekdays(draft.weekdays.includes(day)?draft.weekdays.filter(d=>d!==day):[...draft.weekdays,day]);render();return}if(b.dataset.month){viewMonth=monthShift(viewMonth,Number(b.dataset.month));render();return}if(b.hasAttribute('data-current-month')){viewMonth=today.slice(0,7);render();return}if(b.dataset.markDate)openMark(b.dataset.markDate,b.dataset.markChild)});
window.addEventListener('storage',e=>{if(e.key!==STORE||!e.newValue)return;try{const incoming=migrateState(JSON.parse(e.newValue));state=incoming;if(!state.groups.some(g=>g.id===selectedGroup))selectedGroup=state.groups[0].id;closeDialogs();resetDraft();resetBonusDraft();if(reconcileAwards())persist();render();toast('Данные обновлены в другой вкладке.')}catch{}});
function refreshDate(){const next=todayISO();if(next===today)return;const previous=today.slice(0,7);today=next;if(viewMonth===previous)viewMonth=today.slice(0,7);resetDraft();resetBonusDraft();if(reconcileAwards())persist();closeDialogs();render()}
resetDraft();resetBonusDraft();reconcileAwards();persist();render();setInterval(refreshDate,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDate()});
</script>
